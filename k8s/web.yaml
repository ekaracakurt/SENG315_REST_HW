apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-web
spec:
  replicas: 1    # sqlite → keep 1 for now
  selector:
    matchLabels:
      app: ecommerce-web
  template:
    metadata:
      labels:
        app: ecommerce-web
    spec:
      containers:
        - name: web
          image: IMAGE_URL_HERE  # e.g. us-central1-docker.pkg.dev/PROJECT_ID/ecommerce-repo/ecommerce:SHORT_SHA
          command: ["sh", "-c"]
          args:
            - >
              python manage.py migrate &&
              python manage.py runserver 0.0.0.0:8000
          env:
            - name: CELERY_BROKER_URL
              value: "redis://redis:6379/0"
            - name: CELERY_RESULT_BACKEND
              value: "redis://redis:6379/1"
            - name: DJANGO_SETTINGS_MODULE
              value: "config.settings"
          ports:
            - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-web
spec:
  type: LoadBalancer
  selector:
    app: ecommerce-web
  ports:
    - name: http
      port: 80
      targetPort: 8000
